<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tangent Mind Map</title>
<link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style id="app-style">
/* Layout: full-bleed drafting canvas, slim toolbar on top, format inspector docked right (bottom sheet on phones) */
:root{
  --bg:#f3f6f6; --dot:#cfd9da; --paper:#f7f3ea; --surface:#ffffff; --fg:#17262b; --muted:#5c6f75; --line:#d9e2e3;
  --accent:#0d6b66; --accent-fg:#f4fbfa; --sel:#e8902a; --chip:#e7eeee; --rec:#d23c3c;
  --font-ui:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f171a; --dot:#243338; --paper:#1b1a16; --surface:#172126; --fg:#e2ecee; --muted:#8ea3a8; --line:#283a40;
  --accent:#36aea5; --accent-fg:#06211f; --sel:#f2a54a; --chip:#1f2c31; --rec:#ff6b6b; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f171a; --dot:#243338; --paper:#1b1a16; --surface:#172126; --fg:#e2ecee; --muted:#8ea3a8; --line:#283a40;
  --accent:#36aea5; --accent-fg:#06211f; --sel:#f2a54a; --chip:#1f2c31; --rec:#ff6b6b; color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-ui); overflow:hidden}
#app{height:100%; display:flex; flex-direction:column}
.bar{display:flex; flex-wrap:wrap; align-items:center; gap:4px; padding-block:7px; padding-inline:16px; background:var(--surface); border-bottom:1px solid var(--line); position:relative; z-index:35}
.brand{font-weight:700; letter-spacing:.02em; font-size:15px; margin-right:8px; display:flex; align-items:center}
.brand i{width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:14px 0 0 -2px #c0532b, 7px -9px 0 -3px #557d23; margin-right:20px}
.grp{display:flex; align-items:center; gap:2px}
.sep{width:1px; height:22px; background:var(--line); margin-inline:5px}
.spacer{flex:1}
button,select,.btn{font:inherit; font-size:13px; color:var(--fg); background:transparent; border:1px solid transparent; border-radius:7px; padding:5px 9px; cursor:pointer; line-height:1.2; text-decoration:none; display:inline-flex; align-items:center; gap:6px}
button:hover,select:hover,.btn:hover{background:var(--chip)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,.btn:focus-visible{outline:2px solid var(--sel); outline-offset:1px}
button svg{width:17px; height:17px; flex:none}
select{border-color:var(--line); max-width:210px; background:var(--surface)}
button.primary{background:var(--accent); color:var(--accent-fg); font-weight:600}
button.primary:hover{filter:brightness(1.08); background:var(--accent)}
button.on{background:var(--chip)}
button.recording{color:var(--rec); font-family:var(--font-mono); font-size:12px}
#zoomLabel{font-family:var(--font-mono); font-size:12px; min-width:44px; text-align:center; color:var(--muted)}
#status{font-size:12px; color:var(--muted); padding:4px 10px 4px 8px; border-radius:20px; background:var(--chip); white-space:nowrap; gap:6px}
#status::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--muted); flex:none}
#status[data-s="dirty"],#status[data-s="busy"]{color:var(--sel)}
#status[data-s="dirty"]::before,#status[data-s="busy"]::before{background:var(--sel)}
#status[data-s="ok"]::before,#status[data-s="saved"]::before{background:#2f9e5b}
#status[data-s="err"],#status[data-s="auth"]{color:var(--rec)}
#status[data-s="err"]::before,#status[data-s="auth"]::before{background:var(--rec)}
#status:empty{display:none}
.steps{margin:0 0 12px; padding-left:20px; display:grid; gap:7px; font-size:13px; line-height:1.5; color:var(--muted)}
.steps a,.panel a.inl{color:var(--accent); font-weight:600}
.panel label.fl{display:block; font-size:12px; font-weight:600; margin:10px 0 4px}
.panel input[type=password]{width:100%; box-sizing:border-box; font:13px/1.45 var(--font-mono); color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:7px 9px}
.panel .codebox{font:12px/1.4 var(--font-mono); word-break:break-all; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; max-height:72px; overflow:auto; user-select:all}
.check{display:flex; gap:8px; align-items:flex-start; font-size:13px; margin-top:12px; line-height:1.45}
.check input{margin-top:3px}
.okline{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600}
.okline::before{content:""; width:8px; height:8px; border-radius:50%; background:#2f9e5b}
.okline.bad::before{background:var(--rec)}
.menuwrap{position:relative}
.menu{position:absolute; right:0; top:calc(100% + 6px); min-width:270px; background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:0 12px 36px rgba(10,30,35,.18); padding:6px; display:grid; gap:1px; z-index:30}
.menu button,.menu a{width:100%; justify-content:flex-start; text-align:left; padding:8px 10px; border-radius:6px; flex-direction:column; align-items:flex-start; gap:1px}
.menu small{color:var(--muted); font-size:11.5px}
.menu hr{border:0; border-top:1px solid var(--line); margin:4px 2px}
.menu .danger{color:#c0532b}
#main{flex:1; display:flex; min-height:0; position:relative}
#canvas{flex:1; min-width:0; position:relative; overflow:hidden; touch-action:none; cursor:grab; background-color:var(--bg)}
#canvas.bg-dots{background-image:radial-gradient(var(--dot) 1px, transparent 1.2px); background-size:22px 22px}
#canvas.bg-grid{background-image:linear-gradient(var(--dot) 1px, transparent 1px),linear-gradient(90deg, var(--dot) 1px, transparent 1px); background-size:28px 28px}
#canvas.bg-paper{background-color:var(--paper)}
#canvas:focus{outline:none}
#canvas.panning{cursor:grabbing}
#canvas.dropping{box-shadow:inset 0 0 0 3px var(--accent)}
#world{position:absolute; left:0; top:0; transform-origin:0 0}
#edges{position:absolute; left:0; top:0; overflow:visible; width:1px; height:1px; pointer-events:none}
#edges path{fill:none; stroke-linecap:round; stroke-linejoin:round}
.node{position:absolute; left:0; top:0; width:max-content; max-width:300px; display:flex; flex-direction:column; align-items:flex-start; gap:5px;
  font-weight:500; line-height:1.35; padding:4px 6px; color:var(--fg); cursor:default; user-select:none; -webkit-user-select:none; outline:none; box-sizing:border-box}
.node .row{display:flex; align-items:center; gap:6px; max-width:100%}
.node .txt{white-space:pre-wrap; overflow-wrap:break-word; min-width:1ch; outline:none; max-width:100%}
.node.b .txt{font-weight:750}
.node.it .txt{font-style:italic}
.node .thumb{display:block; border-radius:6px; object-fit:cover; background:var(--chip); cursor:zoom-in; max-width:100%}
.s-root{background:var(--bc); color:var(--on); font-weight:700; padding:12px 22px; border-radius:14px; align-items:center; text-align:center; max-width:340px}
.s-root .row{justify-content:center}
.s-box{background:color-mix(in srgb, var(--bc) 13%, var(--surface)); border:1.5px solid var(--bc); padding:7px 12px; border-radius:9px; font-weight:600}
.s-pill{background:color-mix(in srgb, var(--bc) 13%, var(--surface)); border:1.5px solid var(--bc); padding:7px 15px; border-radius:999px; font-weight:600}
.s-fill{background:var(--bc); color:var(--on); padding:7px 12px; border-radius:9px; font-weight:600}
.s-rect{background:var(--surface); border:1.5px solid var(--bc); padding:6px 10px; border-radius:4px}
.s-line{border-bottom:2px solid var(--bc); border-radius:5px 5px 0 0; padding:3px 5px 4px}
.s-plain{border-radius:6px; padding:3px 6px}
.s-line:hover,.s-plain:hover{background:color-mix(in srgb, var(--bc) 9%, transparent)}
.node.sel{box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--sel)}
.node.hit:not(.sel){box-shadow:0 0 0 2px var(--bg), 0 0 0 4px color-mix(in srgb, var(--sel) 45%, transparent)}
.node.editing{user-select:text; -webkit-user-select:text; cursor:text; box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--sel)}
.node.editing .txt{cursor:text; min-width:2ch}
.s-line.editing,.s-plain.editing{background:var(--surface)}
.node.drop{box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--accent)}
.node.dragging{opacity:.35}
.mk{display:inline-grid; place-items:center; width:17px; height:17px; border-radius:50%; font:700 10px/1 var(--font-ui); color:#fff; flex:none}
.mk-p1{background:#d64545}.mk-p2{background:#e0861a}.mk-p3{background:#3a7bd5}
.mk-done{background:#2f9e5b}.mk-todo{background:transparent; box-shadow:inset 0 0 0 2px #2f9e5b}
.mk-star{background:#e0a91e; font-size:11px}.mk-flag{background:#d64545; font-size:10px}.mk-q{background:#7a55c7}.mk-idea{background:#e0a91e}
.chips{display:flex; flex-wrap:wrap; gap:4px; max-width:100%}
.chip{display:inline-flex; align-items:center; gap:4px; font:500 11.5px/1 var(--font-ui); padding:3px 7px; border-radius:20px; border:1px solid color-mix(in srgb, currentColor 22%, transparent);
  color:inherit; opacity:.85; text-decoration:none; background:transparent; max-width:180px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer}
.chip:hover{opacity:1; background:color-mix(in srgb, currentColor 10%, transparent)}
.chip svg{width:12px; height:12px; flex:none}
.chip.playing{opacity:1; background:color-mix(in srgb, currentColor 14%, transparent)}
.ghost{position:fixed; z-index:40; pointer-events:none; padding:4px 9px; border-radius:6px; background:var(--surface); border:1px solid var(--line); font-size:13px; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,.15); max-width:240px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fold{position:absolute; left:0; top:0; width:max-content; white-space:nowrap; height:18px; min-width:18px; padding:0 4px; border-radius:9px; background:var(--surface); border:1.5px solid var(--bc); color:var(--fg);
  font:600 10px/15px var(--font-mono); text-align:center; cursor:pointer; box-sizing:border-box; display:block}
.fold:hover{background:var(--bc); color:var(--surface)}
.panel{position:absolute; right:16px; top:12px; z-index:20; width:min(370px, calc(100% - 32px)); max-height:calc(100% - 24px); overflow:auto; background:var(--surface);
  border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 40px rgba(10,30,35,.16); padding:16px 18px; box-sizing:border-box}
.panel h2{font-size:15px; margin:0 0 6px; text-wrap:balance}
.panel p{font-size:13px; line-height:1.5; color:var(--muted); margin:0 0 10px}
.panel .close{position:absolute; right:8px; top:8px; font-size:18px; line-height:1; padding:4px 8px; color:var(--muted)}
.keys{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13px; align-items:baseline; margin:0}
.keys dt{white-space:nowrap}
.keys dd{margin:0; color:var(--muted)}
kbd{font-family:var(--font-mono); font-size:11px; padding:1px 5px; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; background:var(--bg); color:var(--fg)}
.panel h3,#inspector h3{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:16px 0 7px; font-weight:600}
textarea,input[type=url],input[type=search],input[type=text]{width:100%; box-sizing:border-box; font:13px/1.45 var(--font-ui); color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:7px 9px}
#importText{min-height:150px; font-family:var(--font-mono); resize:vertical}
#moveOut,#moveIn{min-height:80px; font:11px/1.4 var(--font-mono); resize:vertical; word-break:break-all}
.row2{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.row2 button,.row2 .btn{border-color:var(--line)}
#inspector{width:300px; flex:none; background:var(--surface); border-left:1px solid var(--line); overflow:auto; padding:6px 16px 24px; box-sizing:border-box; z-index:10}
.tabs{display:flex; gap:2px; position:sticky; top:-6px; background:var(--surface); padding:8px 0 8px; border-bottom:1px solid var(--line); z-index:2}
.tabs button[aria-selected="true"]{background:var(--chip); font-weight:600}
.tabs .x{margin-left:auto; font-size:18px; color:var(--muted); padding:2px 9px}
.seg{display:flex; flex-wrap:wrap; gap:4px}
.seg button,.opts button{border-color:var(--line); padding:5px 10px}
.seg button[aria-pressed="true"],.opts button[aria-pressed="true"],.markers button[aria-pressed="true"]{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--surface)); color:var(--fg)}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:5px}
.opts button{justify-content:flex-start; min-width:0; text-align:left}
.opts.structs button{flex-direction:column; align-items:flex-start; gap:6px; padding:8px 10px}
.opts.structs svg{width:44px; height:26px; color:var(--muted)}
.opts.structs button[aria-pressed="true"] svg{color:var(--accent)}
.opts.fonts button{font-size:15px}
.pal{display:flex; gap:3px}
.pal i{width:12px; height:12px; border-radius:50%; display:block}
.swatches{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.sw{width:24px; height:24px; padding:0; border-radius:50%; background:var(--c); border:2px solid var(--surface); box-shadow:0 0 0 1px var(--line); justify-content:center}
.sw:hover{background:var(--c); transform:scale(1.08)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.sw.auto{background:conic-gradient(#d64545,#e0a91e,#2f9e5b,#3a7bd5,#7a55c7,#d64545); color:transparent}
.sw.pick{position:relative; overflow:hidden; background:var(--surface); font-size:14px; color:var(--muted)}
.sw.pick input{position:absolute; inset:-6px; opacity:0; cursor:pointer; width:auto; height:auto}
.markers{display:flex; flex-wrap:wrap; gap:5px}
.markers button{padding:5px; border-color:var(--line)}
.field{display:flex; gap:6px; align-items:center}
.field input{flex:1; min-width:0}
#noteInput{min-height:90px; resize:vertical}
.media-prev{display:block; max-width:100%; max-height:160px; border-radius:8px; margin-bottom:8px; cursor:zoom-in}
#inspector audio{width:100%; margin-bottom:8px}
.hint{font-size:12px; color:var(--muted); margin:6px 0 0; line-height:1.45}
.stack{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.stack button{border-color:var(--line)}
.stack .rec{color:var(--rec); border-color:var(--rec)}
.filebtn{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#searchBox{position:absolute; left:50%; top:12px; transform:translateX(-50%); z-index:22; display:flex; gap:4px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:5px; box-shadow:0 8px 28px rgba(10,30,35,.16); width:min(380px, calc(100% - 32px)); box-sizing:border-box}
#searchBox input{border:0; background:transparent; padding:5px 6px}
#searchBox input:focus-visible{outline:none}
#searchCount{font:12px var(--font-mono); color:var(--muted); white-space:nowrap; padding-inline:4px}
#toast{position:absolute; left:50%; bottom:calc(18px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); background:var(--fg); color:var(--bg); font-size:13px; padding:8px 14px; border-radius:18px; z-index:50; opacity:0; transition:opacity .2s; pointer-events:none; max-width:min(560px, calc(100% - 32px)); text-align:center; line-height:1.4}
#toast.on{opacity:1}
#focusHint{position:absolute; left:16px; bottom:calc(14px + env(safe-area-inset-bottom, 0px)); font-size:12px; color:var(--muted); background:var(--surface); border:1px solid var(--line); padding:5px 10px; border-radius:20px; z-index:4}
#lightbox{position:fixed; inset:0; z-index:60; background:rgba(8,14,16,.82); display:grid; place-items:center; padding:24px; box-sizing:border-box; cursor:zoom-out}
#lightbox img{max-width:100%; max-height:100%; border-radius:8px; box-shadow:0 20px 60px rgba(0,0,0,.4)}
@media (max-width:760px){
  .hide-s{display:none}
  select{max-width:140px}
  #inspector{position:absolute; left:0; right:0; bottom:0; width:auto; height:55%; border-left:0; border-top:1px solid var(--line); box-shadow:0 -10px 30px rgba(10,30,35,.14); border-radius:14px 14px 0 0}
  .lbl{display:none}
}
@media (prefers-reduced-motion: reduce){ #toast{transition:none} .sw:hover{transform:none} }
</style>
<div id="app">
  <div class="bar" role="toolbar" aria-label="Tangent">
    <div class="brand"><i aria-hidden="true"></i>Tangent</div>
    <div class="grp">
      <select id="mapSelect" data-tt="mapPick"></select>
      <button id="newMap" data-tt="newMap" data-icon="plus"><span class="lbl" data-t="new">New</span></button>
    </div>
    <div class="sep hide-s"></div>
    <div class="grp">
      <button id="zoomOut" data-tt="zoomOut">&minus;</button>
      <span id="zoomLabel">100%</span>
      <button id="zoomIn" data-tt="zoomIn">+</button>
      <button id="fitBtn" class="hide-s" data-t="fit">Fit</button>
    </div>
    <div class="sep hide-s"></div>
    <div class="grp hide-s">
      <button id="undoBtn" data-tt="undo" data-icon="undo"></button>
      <button id="redoBtn" data-tt="redo" data-icon="redo"></button>
    </div>
    <div class="sep hide-s"></div>
    <div class="grp">
      <button id="insImg" data-tt="insImage" data-icon="image"></button>
      <button id="insAudio" data-tt="insAudio" data-icon="mic"></button>
      <button id="insLink" data-tt="insLink" data-icon="link"></button>
      <button id="insNote" data-tt="insNote" data-icon="note"></button>
    </div>
    <div class="spacer"></div>
    <div class="grp">
      <button id="status" aria-live="polite"></button>
      <button id="searchBtn" data-tt="search" data-icon="search"></button>
      <button id="fmtBtn" data-icon="brush"><span class="lbl" data-t="format">Format</span></button>
      <div class="menuwrap"><button id="fileBtn" aria-haspopup="true" data-icon="file"><span class="lbl" data-t="file">File</span></button><div id="fileMenu" class="menu" hidden></div></div>
      <button id="helpBtn" data-tt="shortcuts">?</button>
      <button id="saveBtn" class="primary" hidden data-t="save">Save</button>
    </div>
  </div>
  <div id="main">
    <div id="canvas" class="bg-dots" tabindex="-1">
      <div id="world"><svg id="edges" aria-hidden="true"></svg></div>
      <div id="searchBox" hidden><input id="searchInput" type="search" autocomplete="off"><span id="searchCount"></span><button id="searchPrev" data-tt="prev">&uarr;</button><button id="searchNext" data-tt="next">&darr;</button><button id="searchClose" data-tt="close">&times;</button></div>
      <div id="focusHint" hidden data-t="focusHint"></div>
      <div id="toast" role="status"></div>
      <section class="panel" id="helpPanel" hidden></section>
      <section class="panel" id="importPanel" hidden></section>
      <section class="panel" id="syncPanel" hidden></section>
    </div>
    <aside id="inspector" hidden></aside>
  </div>
  <div id="lightbox" hidden><img alt=""></div>

function isDark(){ const a=document.documentElement.getAttribute('data-theme'); if(a==='dark') return true; if(a==='light') return false; return !!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches); }

function mix(h,toward,amt){ const a=rgb(h), b=rgb(toward); return hex(a[0]+(b[0]-a[0])*amt, a[1]+(b[1]-a[1])*amt, a[2]+(b[2]-a[2])*amt); }

// ---------- tree index ----------
function index(){
  N.clear(); P.clear(); D.clear(); BC.clear();
  const p=pal();
  (function walk(n,par,d,inh){
    if(!Array.isArray(n.children)) n.children=[];
    let col;
    if(d===0) col=n.c||p.root; else if(d===1) col=n.c||inh; else col=n.c||inh;
    N.set(n.id,n); P.set(n.id,par); D.set(n.id,d); BC.set(n.id,col);
    n.children.forEach((c,i)=>walk(c,n,d+1, d===0 ? (p.c[((c.color!=null?c.color:i)%6+6)%6]) : col));
  })(cur().root,null,0,null);
}
function kids(n){ return n.collapsed?[]:n.children; }

// ---------- history & persistence ----------
function record(before){ const h=H(); h.past.push(before); if(h.past.length>200) h.past.shift(); h.future=[]; }

function redo(){ const h=H(); if(!h.future.length) return toast(t('t_redoNone')); h.past.push(snap()); restore(h.future.pop()); afterHistory(); }

const media=new Map();
let idbP=null;
function idb(){ if(idbP) return idbP; idbP=new Promise(res=>{ try{ const r=indexedDB.open('tangent-media',1); r.onupgradeneeded=()=>r.result.createObjectStore('m'); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null); }catch(e){ res(null); } }); return idbP; }

function idbGet(id){ return idb().then(db=>{ if(!db) return null; return new Promise(res=>{ try{ const r=db.transaction('m').objectStore('m').get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null); }catch(e){ res(null); } }); }); }
function addMedia(blob){ const id='x'+uid()+uid(); media.set(id,{blob:blob,url:URL.createObjectURL(blob)}); idbPut(id,blob); if(syncCfg) queueMedia([id]); return id; }
function queueMedia(ids){ const p=lsGet(K_PEND)||[]; ids.forEach(i=>{ if(p.indexOf(i)<0) p.push(i); }); lsSet(K_PEND,p); }
function murl(id){ const m=media.get(id); return m?m.url:null; }
function dataUrlToBlob(u){ const i=u.indexOf(','); const head=u.slice(0,i); const mime=(head.match(/data:([^;,]+)/)||[])[1]||'application/octet-stream'; const bin=atob(u.slice(i+1)); const arr=new Uint8Array(bin.length); for(let k=0;k<bin.length;k++) arr[k]=bin.charCodeAt(k); return new Blob([arr],{type:mime}); }
function blobToDataUrl(b){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>res(null); r.readAsDataURL(b); }); }
function referencedMedia(maps){ const ids=new Set(); (maps||data.maps).forEach(m=>walkAll(m.root,n=>{ if(n.img&&n.img.id) ids.add(n.img.id); if(n.audio&&n.audio.id) ids.add(n.audio.id); if(n.file&&n.file.id) ids.add(n.file.id); })); return ids; }
async function loadMedia(extra){
  const emb=Object.assign({},embeddedMedia,extra||{}); let got=false;
  for(const id of referencedMedia()){
    if(media.has(id)) continue;
    let blob=null;
    if(emb[id]){ try{ blob=dataUrlToBlob(emb[id]); idbPut(id,blob); }catch(e){} }
    if(!blob) blob=await idbGet(id);
    if(blob){ media.set(id,{blob:blob,url:URL.createObjectURL(blob)}); got=true; }
  }
  if(got){ render(); renderInspector(true); }
}

function buildNode(n){

function loadImg(u){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=u; }); }
async function prepImage(file){
  const u=URL.createObjectURL(file);
  try{ const im=await loadImg(u); let w=im.naturalWidth||800, h=im.naturalHeight||600; const ar=h/w||.66;
    if(/gif|svg/.test(file.type)||(Math.max(w,h)<=1600&&file.size<700000)) return {blob:file,ar:ar};
    const k=Math.min(1,1600/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(im,0,0,w,h);
    const blob=await new Promise(r=>c.toBlob(r, file.type==='image/png'?'image/webp':'image/jpeg', .86));
    return {blob:(blob&&blob.size<file.size)?blob:file, ar:ar};
  }catch(e){ return {blob:file,ar:.66}; } finally{ URL.revokeObjectURL(u); }
}
function audioDur(blob){ return new Promise(res=>{ const a=new Audio(); const u=URL.createObjectURL(blob); let done=false; const fin=v=>{ if(done) return; done=true; URL.revokeObjectURL(u); res(isFinite(v)?v:0); }; a.preload='metadata'; a.onloadedmetadata=()=>fin(a.duration); a.onerror=()=>fin(0); setTimeout(()=>fin(0),3000); a.src=u; }); }

async function attachFiles(files,targetId,force){
  if(!files||!files.length) return;

  const items=[];
  for(const file of files){
    if(file.size>25*1024*1024){ toast(t('t_tooBig')); continue; }
    const kind= force==='file'? 'file' : /^image\//.test(file.type)? 'img' : /^audio\//.test(file.type)? 'audio' : 'file';
    if(kind==='img'){ const r=await prepImage(file); items.push({kind:kind, name:file.name, blob:r.blob, ar:r.ar}); }
    else if(kind==='audio'){ items.push({kind:kind, name:file.name, blob:file, dur:await audioDur(file)}); }

  if(!items.length) return;

    items.forEach(it=>{

      if(busy||items.length>1&&it!==items[0]){ host=mkChild(target, stripExt(it.name)||t('newTopic')); target.collapsed=false; target.children.push(host); index(); }
      if(it.kind==='img'){ host.img={id:id, ar:it.ar, w:'M'}; msg=t('t_imgAdded'); }
      else if(it.kind==='audio'){ host.audio={id:id, dur:it.dur, name:it.name, type:it.blob.type}; msg=t('t_audioAdded'); }
      else { host.file={id:id, name:it.name, size:it.blob.size, type:it.blob.type}; msg=t('t_fileAdded'); }
      lastId=host.id;
    });
  });
  sel=lastId; render(); ensureVisible(sel); renderInspector(true); toast(msg);
}

function asUrl(s){ s=String(s||'').trim(); if(/\s/.test(s)) return null; if(/^https?:\/\/\S+$/i.test(s)) return s; if(/^www\.[^\s.]+\.\S+$/i.test(s)) return 'https://'+s; return null; }

function toOutline(n,depth,out){ out=out||[]; depth=depth||0; const txt=String(n.text).replace(/\s*\n\s*/g,' ');
  out.push('    '.repeat(depth)+'- '+(n.link? '['+txt+']('+safeHref(n.link)+')' : txt)); n.children.forEach(c=>toOutline(c,depth+1,out)); return out; }

function copySel(cut){ const n=N.get(sel); if(!n) return; clip=JSON.parse(JSON.stringify(n));
  copyText(toOutline(n).join('\n')).then(()=>toast(t(cut?'t_cut':'t_copiedTopic'))); if(cut) del(); }
function parseOutline(text){
  const lines=String(text).replace(/\r/g,'').split('\n').filter(l=>l.trim()); if(!lines.length) return [];
  const items=lines.map(l=>{
    const ws=l.match(/^[ \t ]*/)[0].replace(/\t/g,'    ').length; let s=l.trim(), hl=0, link=null;
    const hm=s.match(/^(#{1,6})\s+/); if(hm){ hl=hm[1].length; s=s.slice(hm[0].length); }
    s=s.replace(/^([-*+•‣▸▶▾◦]|\d+[.)]|[a-z][.)])\s+/i,'').replace(/^\[[ xX]\]\s+/,'');
    const lm=s.match(/\[([^\]]+)\]\(([^)\s]+)\)/); if(lm){ link=lm[2]; }
    s=s.replace(/\*\*(.+?)\*\*/g,'$1').replace(/__(.+?)__/g,'$1').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/`([^`]+)`/g,'$1').trim();
    const bare=asUrl(s); if(bare&&!link){ link=bare; s=hostOf(bare); }
    return {ws:ws,hl:hl,t:s,link:link};
  }).filter(x=>x.t);
  const hls=items.filter(x=>x.hl).map(x=>x.hl), minH=hls.length?Math.min.apply(null,hls):0;
  const wsList=[]; items.forEach(x=>{ if(!x.hl&&wsList.indexOf(x.ws)<0) wsList.push(x.ws); }); wsList.sort((a,b)=>a-b);
  let lastHead=-1; const out=[], stack=[];
  items.forEach(x=>{ let lvl; if(x.hl){ lvl=x.hl-minH; lastHead=lvl; } else { let rank=0; wsList.forEach((w,i)=>{ if(w<=x.ws) rank=i; }); lvl=lastHead+1+rank; }
    const node={id:uid(), text:x.t, children:[]}; if(x.link) node.link=x.link;
    while(stack.length&&stack[stack.length-1].lvl>=lvl) stack.pop();
    if(stack.length) stack[stack.length-1].node.children.push(node); else out.push(node);
    stack.push({lvl:lvl,node:node}); });
  return out;
}
function pasteNodes(nodes,msg){ if(!nodes.length) return false; const target=N.get(sel)||cur().root;
  change(()=>{ target.collapsed=false; const isRoot=D.get(target.id)===0; nodes.forEach(n=>{ if(isRoot){ n.side=sideFor(target); n.color=nextColor(target); } target.children.push(n); }); });

// ---------- cross-device sync (private GitHub repository) ----------
const enc=new TextEncoder(), dec=new TextDecoder();
function bytesToB64(u8){ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
function b64ToBytes(b){ const bin=atob(String(b).replace(/\s/g,'')); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
function syncBase(){ return 'tangent/'+encodeURIComponent(data.doc)+'/'; }
function ghFetch(method,path,body,raw){
  const url='https://api.github.com/repos/'+encodeURIComponent(syncCfg.o)+'/'+encodeURIComponent(syncCfg.r)+'/contents/'+path+(method==='GET'?'?nocache='+Date.now():'');
  const headers={'Authorization':'Bearer '+syncCfg.t,'Accept': raw?'application/vnd.github.raw+json':'application/vnd.github+json'};
  if(body) headers['Content-Type']='application/json';
  return fetch(url,{method:method, headers:headers, cache:'no-store', body: body? JSON.stringify(body) : undefined});
}
function httpErr(r){ return {code: (r.status===401||r.status===403)? 'auth' : 'http', status:r.status}; }
function canon(p){ return JSON.stringify({maps:p.maps||[], del:p.del||{}}); }
function mergeSets(lMaps,lDel,remote){
  const del=Object.assign({},remote.del||{}); Object.keys(lDel||{}).forEach(k=>{ del[k]=Math.max(del[k]||0,lDel[k]); });
  const byId=new Map(), order=[], rById=new Map();
  (remote.maps||[]).forEach(m=>rById.set(m.id,m));
  lMaps.forEach(m=>{ const r=rById.get(m.id); byId.set(m.id, (r&&(r.u||0)>(m.u||0))? r : m); order.push(m.id); });
  (remote.maps||[]).forEach(m=>{ if(!byId.has(m.id)){ byId.set(m.id,m); order.push(m.id); } });
  const maps=order.map(id=>byId.get(id)).filter(m=>!(del[m.id]&&del[m.id]>=(m.u||0)));
  return {maps:maps, del:del};
}
async function pullRemote(){
  const r=await ghFetch('GET',syncBase()+'data.json');
  if(r.status===404) return {missing:true};
  if(!r.ok) throw httpErr(r);
  const j=await r.json(); let text;
  if(j.content&&j.encoding==='base64') text=dec.decode(b64ToBytes(j.content));
  else { const rr=await ghFetch('GET',syncBase()+'data.json',null,true); if(!rr.ok) throw httpErr(rr); text=await rr.text(); }
  return {sha:j.sha, payload:JSON.parse(text)};
}
function applyRemote(p){
  SY.remoteCanon=canon(p);
  const before=canon({maps:data.maps, del:data.del});
  const m=mergeSets(data.maps,data.del,p);
  if(!m.maps.length) return;
  m.maps.forEach(normalizeMap);
  const after=canon(m);
  if(after!==SY.remoteCanon) SY.mergeDirty=true;
  if(after===before) return;
  const curBefore=cur()? JSON.stringify({r:cur().root,s:cur().style}) : '';
  data.maps=m.maps; data.del=m.del;
  if(!findMap(curId)) curId=data.maps[0].id;
  const curAfter=JSON.stringify({r:cur().root,s:cur().style});
  if(curBefore!==curAfter) delete hist[curId];
  const rec={at:Date.now(), maps:data.maps, del:data.del}; lsSet(K_PATH,rec); lsSet(K_DOC,rec);
  index(); if(!N.has(sel)) sel=cur().root.id; fillMapSelect(); render(); renderInspector();
  if(curBefore!==curAfter) toast(t('t_syncUpdated'));
  loadMedia();
}
async function pushRemote(){
  const payload={v:2, doc:data.doc, at:Date.now(), maps:data.maps, del:data.del};
  if(canon(payload)===SY.remoteCanon) return 'same';
  const body={message:'Tangent · '+new Date().toISOString().slice(0,16).replace('T',' '), content:bytesToB64(enc.encode(JSON.stringify(payload)))};
  if(SY.sha) body.sha=SY.sha;
  const r=await ghFetch('PUT',syncBase()+'data.json',body);
  if(r.status===409||r.status===422) return 'conflict';
  if(!r.ok) throw httpErr(r);
  const j=await r.json(); SY.sha=j.content&&j.content.sha; SY.remoteCanon=canon(payload); return 'ok';
}
async function uploadPending(){
  let pend=lsGet(K_PEND)||[]; if(!pend.length) return;
  for(const id of pend.slice()){
    let blob=media.get(id)? media.get(id).blob : await idbGet(id);
    if(blob){
      const b64=bytesToB64(new Uint8Array(await blob.arrayBuffer()));
      const r=await ghFetch('PUT',syncBase()+'media/'+id,{message:'Tangent media '+id, content:b64});
      if(!r.ok&&r.status!==422) throw httpErr(r);
    }
    pend=(lsGet(K_PEND)||[]).filter(x=>x!==id); lsSet(K_PEND,pend);
  }
}
function mediaTypes(){ const m={}; data.maps.forEach(mp=>walkAll(mp.root,n=>{ if(n.audio&&n.audio.type) m[n.audio.id]=n.audio.type; if(n.file&&n.file.type) m[n.file.id]=n.file.type; })); return m; }
async function fetchMissingMedia(){
  const types=mediaTypes(), pend=lsGet(K_PEND)||[]; let got=false;
  for(const id of referencedMedia()){
    if(media.has(id)||pend.indexOf(id)>=0) continue;
    const local=await idbGet(id); if(local){ media.set(id,{blob:local,url:URL.createObjectURL(local)}); got=true; continue; }
    try{ const r=await ghFetch('GET',syncBase()+'media/'+id,null,true); if(!r.ok) continue;
      const buf=await r.arrayBuffer(); const blob=new Blob([buf],{type:types[id]||r.headers.get('content-type')||''});
      media.set(id,{blob:blob,url:URL.createObjectURL(blob)}); idbPut(id,blob); got=true; }catch(e){}
  }
  if(got){ render(); renderInspector(true); }
}
function setSyncState(s,err){ SY.state=s; SY.err=err||''; updateStatus(); if(!$('#syncPanel').hidden) renderSync(); }
function scheduleSync(ms){ if(!syncCfg) return; clearTimeout(SY.timer); SY.timer=setTimeout(()=>syncCycle(),ms); }
async function syncCycle(){
  if(!syncCfg) return;
  if(SY.inflight){ SY.again=true; return; }
  if(editing||drag||noteBefore){ scheduleSync(1500); return; }
  SY.inflight=true; setSyncState('busy');
  try{
    await uploadPending();
    for(let attempt=0; attempt<3; attempt++){
      const rem=await pullRemote();
      if(rem.missing){ SY.sha=null; SY.remoteCanon=null; SY.mergeDirty=true; }
      else if(rem.sha!==SY.sha){ SY.sha=rem.sha; if(editing){ SY.again=true; break; } applyRemote(rem.payload); }
      if(!(SY.rev>SY.pushedRev||SY.mergeDirty)) break;
      const revAt=SY.rev; const res=await pushRemote();
      if(res==='conflict'){ SY.sha=null; continue; }
      SY.pushedRev=revAt; SY.mergeDirty=false; break;
    }
    SY.last=Date.now(); lsSet(K_SYNCMETA,{sha:SY.sha, pushedAt:SY.rev===SY.pushedRev? Date.now() : 0});
    setSyncState('ok');
    fetchMissingMedia();
  }catch(e){
    if(e instanceof TypeError){ if(navigator.onLine===false) setSyncState('offline', t('t_syncNet')); else setSyncState('blocked', t('t_syncBlocked')); }
    else if(e&&e.code==='auth') setSyncState('auth', t('t_syncBadToken'));
    else setSyncState('err', t('t_syncErr',{x:(e&&e.status)||'?'}));
  }
  SY.inflight=false;
  if(SY.again){ SY.again=false; scheduleSync(600); }
}
function parseRepo(s){ s=String(s||'').trim().replace(/\.git$/,'').replace(/\/+$/,''); const m=s.match(/(?:github\.com\/)?([A-Za-z0-9-_.]+)\/([A-Za-z0-9-_.]+)$/); return m? {o:m[1], r:m[2]} : null; }
function makeCode(){ return 'TANGENT-SYNC:'+btoa(JSON.stringify({o:syncCfg.o, r:syncCfg.r, t:syncCfg.t})); }
function readCode(s){ try{ s=String(s||'').trim(); if(s.indexOf('TANGENT-SYNC:')!==0) return null; const o=JSON.parse(atob(s.slice(13))); return o&&o.o&&o.r&&o.t? o : null; }catch(e){ return null; } }
async function connect(o,r,tk,btn){
  if(!o||!r||!tk) return toast(t('t_syncFill'));
  if(btn){ btn.disabled=true; }
  let res;
  try{ res=await fetch('https://api.github.com/repos/'+encodeURIComponent(o)+'/'+encodeURIComponent(r),{headers:{'Authorization':'Bearer '+tk,'Accept':'application/vnd.github+json'},cache:'no-store'}); }
  catch(e){ if(btn) btn.disabled=false; SY.state='blocked'; renderSync(); return toast(t('t_syncBlocked'),7000); }
  if(btn) btn.disabled=false;
  if(res.status===401||res.status===403) return toast(t('t_syncBadToken'),6000);

// ---------- maps & menus ----------
function mapName(m){ const s=(m.root.text||t('untitled')).split('\n')[0]; return s.length>40? s.slice(0,39)+'…' : s; }
function fillMapSelect(){ const s=$('#mapSelect'); s.innerHTML=''; data.maps.forEach(m=>{ const o=document.createElement('option'); o.value=m.id; o.textContent=mapName(m); s.appendChild(o); }); s.value=curId; }
function openMap(id,first){
  if(editing) commitEdit(); if(!first) stashUi();
  curId=id; index(); hits=new Set();
  sel=(first&&ui.sel&&N.has(ui.sel))? ui.sel : cur().root.id;
  fillMapSelect(); render(); renderInspector(true);
  const v=ui.views&&ui.views[id];
  if(v&&first){ view.x=v.x; view.y=v.y; view.s=v.s; applyView(); } else fit();
  ui.mapId=id; lsSet(K_UI,ui);
}
$('#mapSelect').addEventListener('change',e=>{ openMap(e.target.value); canvas.focus({preventScroll:true}); });
$('#newMap').addEventListener('click',()=>{ const m=newMapObj(); data.maps.push(m); touch(); openMap(m.id); startEdit(m.root.id,{selectAll:true,isNew:true}); });
let delArmed=false;
function renderFileMenu(){
  const m=$('#fileMenu'); let h='';
  const item=(act,label,sub,cls)=>'<button data-fm="'+act+'"'+(cls?' class="'+cls+'"':'')+'><span>'+esc(label)+'</span>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</button>';
  h+=item('html',t('fm_download'),t('fm_downloadSub'));
  h+=item('copy',t('fm_copyList'),t('fm_copySub'));
  h+=item('outline',t('fm_paste'),t('fm_pasteSub'));
  h+='<hr>'+item('sync',t('fm_sync'),syncCfg? t('sy_connected',{r:syncCfg.o+'/'+syncCfg.r}) : t('fm_syncSub'));
  h+=item('move',t('fm_move'),t('fm_moveSub'));
  h+='<hr>'+item('json',t('fm_json'),t('fm_jsonSub'))+item('import',t('fm_importJson'));
  if(inFrame) h+='<hr><a class="btn" href="'+esc(location.href)+'" target="_blank" rel="noopener"><span>'+esc(t('fm_newTab'))+'</span><small>'+esc(t('fm_newTabSub'))+'</small></a>';
  h+='<hr>'+item('delete', delArmed? t('confirmDelete') : t('fm_delete'), '', 'danger');
  m.innerHTML=h;
}
function toggleMenu(force){ const m=$('#fileMenu'); const show= force!=null? force : m.hidden; if(show){ delArmed=false; renderFileMenu(); } m.hidden=!show; }
$('#fileBtn').addEventListener('click',e=>{ e.stopPropagation(); toggleMenu(); });
document.addEventListener('click',e=>{ if(!e.target.closest('.menuwrap')) $('#fileMenu').hidden=true; });
$('#fileMenu').addEventListener('click',e=>{
  e.stopPropagation();
  if(e.target.closest('a')){ toggleMenu(false); return; }
  const b=e.target.closest('[data-fm]'); if(!b) return; const a=b.dataset.fm;
  if(a==='delete'){
    if(data.maps.length<2){ toggleMenu(false); return toast(t('t_keepOne')); }
    if(!delArmed){ delArmed=true; renderFileMenu(); return; }
    const name=mapName(cur()); data.del[curId]=Date.now(); data.maps=data.maps.filter(m=>m.id!==curId); delete hist[curId]; touch(); toggleMenu(false); openMap(data.maps[0].id); return toast(t('t_deleted',{x:name}));
  }
  toggleMenu(false);
  if(a==='html') downloadHtml();
  else if(a==='json') downloadJson();
  else if(a==='import') pickFiles('json');
  else if(a==='copy') copyMap();
  else if(a==='outline') openImport();
  else if(a==='sync') openSync();
  else if(a==='move') openMove();
});
function copyMap(){ const s=toOutline(cur().root).join('\n'); copyText(s).then(ok=>{ if(ok) return toast(t('t_copied')); openImport(s); toast(t('t_copyBlocked'),5000); }); }
function openImport(prefill){
  const p=$('#importPanel');
  p.innerHTML='<button class="close" data-close="importPanel" aria-label="'+esc(t('close'))+'">&times;</button><h2>'+esc(t('importTitle'))+'</h2><p>'+esc(t('importHelp'))+'</p><textarea id="importText" placeholder="- Hedefler&#10;    - Kayıtları artır&#10;- Kanallar&#10;    - E-posta"></textarea><div class="row2"><button data-imp="add">'+esc(t('importAdd'))+'</button><button data-imp="new">'+esc(t('importNew'))+'</button></div>';
  $('#helpPanel').hidden=true; $('#syncPanel').hidden=true; p.hidden=false; const ta=$('#importText'); if(prefill){ ta.value=prefill; ta.focus(); ta.select(); } else ta.focus();
}
$('#importPanel').addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){ $('#importPanel').hidden=true; canvas.focus({preventScroll:true}); return; }
  const b=e.target.closest('[data-imp]'); if(!b) return; const raw=$('#importText').value;
  if(/^\s*\{/.test(raw)){ importBackupText(raw).then(ok=>{ if(ok) $('#importPanel').hidden=true; }); return; }
  const nodes=parseOutline(raw);
  if(!nodes.length) return toast(t('t_nothing'));
  if(b.dataset.imp==='add'){ pasteNodes(nodes,t('t_added',{n:nodes.length})); }
  else { const m=newMapObj(); if(nodes.length===1){ m.root=nodes[0]; delete m.root.side; } else m.root.children=nodes;
    m.root.children.forEach((c,i)=>{ c.color=i%6; c.side=i%2===0?'R':'L'; }); data.maps.push(m); touch(); openMap(m.id); }
  $('#importPanel').hidden=true; canvas.focus({preventScroll:true});
});

// ---------- help ----------
function renderHelp(){
  const k=(...ks)=>ks.map(x=>'<kbd>'+esc(x)+'</kbd>').join(' ');
  const rows=(list)=>'<dl class="keys">'+list.map(r=>'<dt>'+r[0]+'</dt><dd>'+esc(t(r[1]))+'</dd>').join('')+'</dl>';
  $('#helpPanel').innerHTML='<button class="close" data-close="helpPanel" aria-label="'+esc(t('close'))+'">&times;</button><h2>'+esc(t('shortcuts'))+'</h2>'
  +'<h3>'+esc(t('h_build'))+'</h3>'+rows([[k('Tab'),'k_tab'],[k('Enter'),'k_enter'],[k('Shift','Enter'),'k_senter'],[k(MOD,'Enter'),'k_center'],[esc(t('type')),'k_type'],[k('Space')+' '+k('F2'),'k_edit'],[k('Shift','Enter'),'k_nl'],[k('Del'),'k_del']])
  +'<h3>'+esc(t('h_move'))+'</h3>'+rows([[k('←','↑','↓','→'),'k_arrows'],[k(ALT,'↑','↓'),'k_reorder'],[k(ALT,'←','→'),'k_side'],[esc(t('drag')),'k_drag'],[k(MOD,'/'),'k_fold']])
  +'<h3>'+esc(t('h_format'))+'</h3>'+rows([[k(MOD,'B')+' '+k(MOD,'I'),'k_bi'],[k(ALT,'1','2','3'),'k_prio'],[k(ALT,'D'),'k_done'],[k(MOD,'K'),'k_link'],[k(ALT,'N'),'k_note'],[k(ALT,'I'),'k_img'],[k(ALT,'R'),'k_rec'],[k(MOD,'V'),'k_pasteMedia']])
  +'<h3>'+esc(t('h_view'))+'</h3>'+rows([[k(MOD,'Z'),'k_undo'],[k(MOD,'C')+' '+k(MOD,'X'),'k_clip'],[k(MOD,'F'),'k_find'],[k(MOD,'S'),'k_save'],[k(MOD,'0'),'k_fit'],[k(MOD)+' + '+esc(t('scroll')),'k_zoom'],[k('?'),'k_help']]);
}
$('#helpPanel').addEventListener('click',e=>{ if(e.target.closest('[data-close]')){ $('#helpPanel').hidden=true; canvas.focus({preventScroll:true}); } });
function toggleHelp(){ const p=$('#helpPanel'); $('#importPanel').hidden=true; $('#syncPanel').hidden=true; p.hidden=!p.hidden; }

// ---------- search ----------
let matches=[], mIdx=0;
function openSearch(){ $('#searchBox').hidden=false; const i=$('#searchInput'); i.placeholder=t('searchPh'); i.focus(); i.select(); runSearch(); }
function closeSearch(){ $('#searchBox').hidden=true; hits=new Set(); layout(); canvas.focus({preventScroll:true}); }
function norm(s){ return String(s||'').toLocaleLowerCase(lang==='tr'?'tr':undefined); }
function runSearch(){ const q=norm($('#searchInput').value.trim()); matches=[]; mIdx=0;
  if(q) walkAll(cur().root,n=>{ if(norm(n.text).indexOf(q)>=0||norm(n.note).indexOf(q)>=0||norm(n.link).indexOf(q)>=0) matches.push(n.id); });
  hits=new Set(matches); $('#searchCount').textContent= q? (matches.length? '1/'+matches.length : t('t_noMatch')) : '';
  if(matches.length) goMatch(0); else layout(); }
function goMatch(i){ if(!matches.length) return; mIdx=(i+matches.length)%matches.length; const id=matches[mIdx];
  let p=P.get(id), opened=false; while(p){ if(p.collapsed){ p.collapsed=false; opened=true; } p=P.get(p.id); } if(opened){ touch(); render(); }
  sel=id; layout(); ensureVisible(id); renderInspector(); $('#searchCount').textContent=(mIdx+1)+'/'+matches.length; }
$('#searchInput').addEventListener('input',runSearch);
$('#searchInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); goMatch(mIdx+(e.shiftKey?-1:1)); } else if(e.key==='Escape'){ e.preventDefault(); closeSearch(); } });
$('#searchPrev').addEventListener('click',()=>goMatch(mIdx-1)); $('#searchNext').addEventListener('click',()=>goMatch(mIdx+1)); $('#searchClose').addEventListener('click',closeSearch);

// ---------- toolbar ----------
$('#zoomIn').addEventListener('click',()=>zoomCenter(1.2)); $('#zoomOut').addEventListener('click',()=>zoomCenter(1/1.2));
$('#fitBtn').addEventListener('click',fit); $('#undoBtn').addEventListener('click',undo); $('#redoBtn').addEventListener('click',redo);
$('#saveBtn').addEventListener('click',savePage); $('#helpBtn').addEventListener('click',toggleHelp); $('#searchBtn').addEventListener('click',openSearch);
$('#fmtBtn').addEventListener('click',()=>{ insp.hidden? openInspector() : closeInspector(); });
$('#insImg').addEventListener('click',()=>pickFiles('img'));
$('#insAudio').addEventListener('click',toggleRec);
$('#insLink').addEventListener('click',()=>openInspector('topic','linkInput'));
$('#insNote').addEventListener('click',()=>openInspector('topic','noteInput'));
$('#status').addEventListener('click',()=>{ if(artifactCap&&!readOnly) return toast(t('k_save')+': '+MOD+' S',4000); openSync(); });
$('.bar').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b&&!b.closest('.menuwrap')&&!/insLink|insNote|searchBtn/.test(b.id)) canvas.focus({preventScroll:true}); });

// ---------- lightbox, toast, focus ----------
function showLightbox(src){ if(!src) return; const lb=$('#lightbox'); lb.querySelector('img').src=src; lb.hidden=false; }
$('#lightbox').addEventListener('click',()=>{ $('#lightbox').hidden=true; canvas.focus({preventScroll:true}); });
let toastTimer=null;
function toast(msg,ms){ const el=$('#toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('on'),ms||2400); }
function focusHint(){ $('#focusHint').hidden=document.hasFocus(); }
window.addEventListener('focus',focusHint); window.addEventListener('blur',focusHint);

// ---------- keyboard ----------
document.addEventListener('keydown',e=>{
  if(editing) return;
  if(!$('#lightbox').hidden&&e.key==='Escape'){ $('#lightbox').hidden=true; return; }
  const a=document.activeElement, tag=a&&a.tagName;
  if(tag==='TEXTAREA'||tag==='INPUT'||tag==='SELECT'){ if(e.key==='Escape'){ a.blur(); canvas.focus({preventScroll:true}); } return; }
  const mod=e.ctrlKey||e.metaKey, k=e.key, code=e.code||'';
  const inUi=a&&a!==document.body&&a!==canvas&&!!(a.closest&&a.closest('#inspector,.panel,.menu,.bar'));
  if(inUi&&!mod&&k!=='Escape') return;
  if(e.ctrlKey&&e.altKey&&!e.metaKey&&k.length===1&&sel){ e.preventDefault(); return startEdit(sel,{replaceWith:k}); }
  if(mod&&(k==='s'||k==='S')){ e.preventDefault(); return savePage(); }
  if(mod&&(k==='z'||k==='Z')){ e.preventDefault(); return e.shiftKey? redo() : undo(); }
  if(mod&&(k==='y'||k==='Y')){ e.preventDefault(); return redo(); }
  if(mod&&(k==='f'||k==='F')){ e.preventDefault(); return openSearch(); }
  if(mod&&(k==='c'||k==='C')){ if(String(window.getSelection())) return; e.preventDefault(); return copySel(false); }
  if(mod&&(k==='x'||k==='X')){ e.preventDefault(); return copySel(true); }
  if(mod&&(k==='b'||k==='B')){ e.preventDefault(); return setProp(n=>{ n.b=!n.b; if(!n.b) delete n.b; }); }
  if(mod&&(k==='i'||k==='I')){ e.preventDefault(); return setProp(n=>{ n.i=!n.i; if(!n.i) delete n.i; }); }
  if(mod&&(k==='k'||k==='K')){ e.preventDefault(); return openInspector('topic','linkInput'); }
  if(mod&&k==='/'){ e.preventDefault(); return toggleFold(); }
  if(mod&&(k==='='||k==='+')){ e.preventDefault(); return zoomCenter(1.2); }
  if(mod&&(k==='-'||k==='_')){ e.preventDefault(); return zoomCenter(1/1.2); }
  if(mod&&k==='0'){ e.preventDefault(); return fit(); }
  if(mod&&k==='Enter'){ e.preventDefault(); return insertParent(); }
  if(mod) return;
  if(e.altKey){
    if(code==='Digit1'||code==='Digit2'||code==='Digit3'){ e.preventDefault(); return setPriority(+code.slice(5)); }
    if(code==='Digit0'){ e.preventDefault(); return setPriority(0); }
    if(code==='KeyD'){ e.preventDefault(); return toggleMarker('done'); }
    if(code==='KeyN'){ e.preventDefault(); return openInspector('topic','noteInput'); }
    if(code==='KeyI'){ e.preventDefault(); return pickFiles('img'); }
    if(code==='KeyR'){ e.preventDefault(); return toggleRec(); }
  }
  if(tag==='BUTTON'&&(k==='Enter'||k===' ')) return;
  if(k==='Escape'){ $('#helpPanel').hidden=true; $('#importPanel').hidden=true; $('#syncPanel').hidden=true; $('#fileMenu').hidden=true; if(!$('#searchBox').hidden) closeSearch(); return; }
  if(k==='Tab'){ e.preventDefault(); return addChild(); }
  if(k==='Enter'){ e.preventDefault(); return addSibling(e.shiftKey); }
  if(k==='Delete'||k==='Backspace'){ e.preventDefault(); return del(); }
  if(k==='F2'||k===' '){ e.preventDefault(); return startEdit(sel); }
  if(k.indexOf('Arrow')===0){ e.preventDefault(); const dk={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D'}[k];
    if(e.altKey){ if(dk==='U'||dk==='D') return reorder(dk==='U'); return switchSide(dk==='L'); } return nav(dk); }
  if(k==='?'){ e.preventDefault(); return toggleHelp(); }
  if(k.length===1&&!e.altKey&&sel){ e.preventDefault(); return startEdit(sel,{replaceWith:k}); }
});

// ---------- pointer: select, drag, pan, chips ----------
let drag=null;
canvas.addEventListener('pointerdown',e=>{
  if(e.button!==0) return;
  if(e.target.closest('.panel,#searchBox')) return;
  const nodeEl=e.target.closest('.node');
  if(nodeEl&&nodeEl.dataset.id===editing&&e.target.closest('.txt')) return;
  if(editing) commitEdit();
  if(e.target.closest('.chip,.thumb')){ const ne=e.target.closest('.node'); if(ne&&ne.dataset.id!==sel) select(ne.dataset.id); return; }
  if(nodeEl){ const id=nodeEl.dataset.id; if(id!==sel) select(id); drag={mode:'node',id:id,sx:e.clientX,sy:e.clientY,started:false,pid:e.pointerId}; }
  else { drag={mode:'pan',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y,pid:e.pointerId}; canvas.classList.add('panning'); }
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  canvas.focus({preventScroll:true}); e.preventDefault();
});
canvas.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid) return;
  if(drag.mode==='pan'){ view.x=drag.vx+(e.clientX-drag.sx); view.y=drag.vy+(e.clientY-drag.sy); applyView(); return; }
  if(!drag.started){ if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6||D.get(drag.id)===0) return;
    drag.started=true; const g=document.createElement('div'); g.className='ghost'; g.textContent=N.get(drag.id).text; document.body.appendChild(g); drag.ghost=g; els.get(drag.id).classList.add('dragging'); }
  drag.ghost.style.left=(e.clientX+12)+'px'; drag.ghost.style.top=(e.clientY+10)+'px';
  const under=document.elementFromPoint(e.clientX,e.clientY), tn=under&&under.closest&&under.closest('.node');
  let tid=tn? tn.dataset.id : null; const me=N.get(drag.id);
  if(tid&&(tid===drag.id||isAncestor(me,N.get(tid)))) tid=null;
  if(drag.target!==tid){ if(drag.target&&els.get(drag.target)) els.get(drag.target).classList.remove('drop'); drag.target=tid; if(tid) els.get(tid).classList.add('drop'); }
});
function endDrag(e){
  if(!drag||(e&&e.pointerId!==drag.pid)) return; const d=drag; drag=null; canvas.classList.remove('panning');
  if(d.mode!=='node'||!d.started) return; if(d.ghost) d.ghost.remove();
  const me=N.get(d.id), tgt=d.target&&N.get(d.target);
  if(tgt){ const from=P.get(d.id);
    change(()=>{ from.children.splice(from.children.indexOf(me),1); if(D.get(from.id)===0){ delete me.side; delete me.color; } tgt.collapsed=false;
      if(D.get(tgt.id)===0){ const rp=pos[tgt.id], ex=(e.clientX-canvas.getBoundingClientRect().left-view.x)/view.s; me.side= ex<rp.x+rp.w/2? 'L':'R'; me.color=nextColor(tgt); }
      tgt.children.push(me); });
    sel=d.id; render(); ensureVisible(sel); renderInspector(); } else render();
}
canvas.addEventListener('pointerup',endDrag); canvas.addEventListener('pointercancel',endDrag);
canvas.addEventListener('click',e=>{
  const pl=e.target.closest('[data-play]'); if(pl){ e.stopPropagation(); return togglePlay(pl.dataset.play); }
  const dl=e.target.closest('[data-dl]'); if(dl){ e.stopPropagation(); return downloadAttachment(dl.dataset.dl); }
  const nt=e.target.closest('[data-note]'); if(nt){ e.stopPropagation(); sel=nt.dataset.note; layout(); return openInspector('topic','noteInput'); }
  const th=e.target.closest('.thumb'); if(th){ return showLightbox(th.src); }
});
canvas.addEventListener('dblclick',e=>{ if(e.target.closest('.chip,.thumb')) return; const n=e.target.closest('.node'); if(n&&n.dataset.id!==editing){ e.preventDefault(); startEdit(n.dataset.id,{selectAll:true}); } });
canvas.addEventListener('wheel',e=>{ if(e.target.closest('.panel')) return; e.preventDefault(); const rc=canvas.getBoundingClientRect();
  if(e.ctrlKey||e.metaKey) zoomAt(Math.exp(-e.deltaY*.0035*(e.deltaMode===1?16:1)),e.clientX-rc.left,e.clientY-rc.top); else { view.x-=e.deltaX; view.y-=e.deltaY; applyView(); } },{passive:false});
// drop files or links
canvas.addEventListener('dragover',e=>{ const ty=Array.from(e.dataTransfer&&e.dataTransfer.types||[]); if(ty.indexOf('Files')>=0||ty.indexOf('text/uri-list')>=0){ e.preventDefault(); canvas.classList.add('dropping'); } });
canvas.addEventListener('dragleave',e=>{ if(e.target===canvas) canvas.classList.remove('dropping'); });
canvas.addEventListener('drop',e=>{ canvas.classList.remove('dropping'); const dt=e.dataTransfer; if(!dt) return; e.preventDefault();
  const under=document.elementFromPoint(e.clientX,e.clientY), tn=under&&under.closest&&under.closest('.node'); if(tn){ sel=tn.dataset.id; layout(); }
  const files=Array.from(dt.files||[]); if(files.length) return attachFiles(files,sel);
  const u=asUrl((dt.getData('text/uri-list')||dt.getData('text/plain')||'').split('\n')[0]); if(u) setLink(u); });
window.addEventListener('resize',()=>applyView());
if(window.matchMedia){ const mq=matchMedia('(prefers-color-scheme: dark)'); if(mq.addEventListener) mq.addEventListener('change',()=>render()); }
new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

// ---------- i18n apply & start ----------
function applyI18n(){
  document.documentElement.lang=lang;
  $$('[data-t]').forEach(el=>{ el.textContent=t(el.dataset.t); });
  $$('[data-tt]').forEach(el=>{ el.title=t(el.dataset.tt); el.setAttribute('aria-label',el.title); });
  $('#fmtBtn').title=t('format'); $('#fileBtn').title=t('file');
}
$$('[data-icon]').forEach(el=>{ el.insertAdjacentHTML('afterbegin',svg(el.dataset.icon)); });
applyI18n(); renderHelp();
openMap(curId,true);
if(ui.insp){ insp.hidden=false; $('#fmtBtn').classList.add('on'); renderInspector(true); requestAnimationFrame(()=>{ if(!(ui.views&&ui.views[curId])) fit(); }); }
if(syncCfg){ const meta=lsGet(K_SYNCMETA)||{}; SY.sha=meta.sha||null; if(!meta.pushedAt||localAt>meta.pushedAt) SY.mergeDirty=true; SY.state='busy'; }
updateStatus(); focusHint(); canvas.focus({preventScroll:true});
if(restoredLegacy){ toast(t('t_restored'),4000); saveLocal(); }
loadMedia().then(()=>{ if(syncCfg) syncCycle(); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(!editing){ layout(); if(!(ui.views&&ui.views[curId])) fit(); } });
if(window.claude&&typeof window.claude.use==='function'){
  window.claude.use('artifact').then(c=>{ artifactCap=c||null; updateStatus(); }).catch(()=>{});
  window.claude.use('downloads').then(c=>{ downloadsCap=c||null; }).catch(()=>{});
}
})();
</script>
